<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Development</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 420px; /* Membatasi lebar agar pas dengan ukuran meme */
        }

        /* Simbol kincir/loader minimalis buatan sendiri dengan CSS */
        .dev-symbol {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #eeeeee;
            border-radius: 50%;
            border-top-color: #111111; /* Bagian hitam yang berputar */
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            margin: 0 0 8px 0;
        }

        p {
            font-size: 0.95rem;
            color: #666666;
            margin: 0 0 24px 0;
        }

        /* Frame kotak tipis pembungkus meme */
        .meme-container {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            background-color: #f9fafb;
        }

        .meme-container img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="dev-symbol"></div>
        
        <h1>Under Development</h1>
        <p>Fixing bugs and making things work. Check back later.</p>
        <div class="p">Sedang dalam pembuatan doain guys bisa cepet selesai ya heheheh</div>
        
        <div class="meme-container">
            <img src="https://media.giphy.com/media/USV09mPfJzS13mAn9z/giphy.gif" alt="Programmer typing fast">
        </div>
    </div>

</body>
</html>
