<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedang Dikerjakan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#fbfbf9;
    --line:#dcdcd6;
    --ink:#2b2b2e;
    --marker-blue:#2f5fa8;
    --marker-red:#c0392b;
    --marker-orange:#e08a2b;
    --marker-green:#2f8a5b;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--board);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    font-family:'Patrick Hand', cursive;
    color:var(--ink);
    overflow:hidden;
    position:relative;
  }

  /* subtle whiteboard sheen */
  body::before{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(circle at 30% 15%, rgba(255,255,255,.9), rgba(255,255,255,0) 45%);
    pointer-events:none;
  }

  .board-frame{
    position:absolute;
    inset:14px;
    border:10px solid #d8d5cc;
    border-radius:6px;
    box-shadow:inset 0 0 0 2px #ffffff, 0 10px 30px rgba(0,0,0,.08);
    pointer-events:none;
  }

  .marker-tray{
    position:absolute;
    bottom:26px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:4;
  }
  .marker-tray span{
    width:36px; height:9px; border-radius:4px;
    box-shadow:0 2px 3px rgba(0,0,0,.15);
  }

  .container{
    position:relative;
    z-index:5;
    text-align:center;
    max-width:460px;
    width:90%;
    padding:10px 10px 4px;
  }

  h1.title{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:2.6rem;
    line-height:1;
    color:var(--marker-blue);
    margin:0 0 4px;
    transform:rotate(-1.2deg);
    -webkit-text-stroke:.4px var(--marker-blue);
  }

  .underline-scribble{
    width:220px;
    height:14px;
    margin:0 auto 14px;
  }

  .scene{
    position:relative;
    width:100%;
    max-width:420px;
    margin:0 auto 10px;
  }
  .scene svg{ width:100%; height:auto; display:block; }

  .bubble-text{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:1.3rem;
    fill:var(--ink);
  }

  p.sub{
    font-size:1.15rem;
    color:var(--ink);
    margin:6px 0 2px;
    line-height:1.4;
  }

  .scribble-note{
    display:inline-block;
    margin-top:10px;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:1.3rem;
    color:var(--marker-red);
    transform:rotate(-2deg);
  }

  .hammer{
    transform-origin:85% 85%;
    animation:bonk 1.1s ease-in-out infinite;
  }
  @keyframes bonk{
    0%,100%{ transform:rotate(0deg); }
    30%{ transform:rotate(-28deg); }
    45%{ transform:rotate(6deg); }
  }
  .dust{
    animation:pop 1.1s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes pop{
    0%,100%{ opacity:0; transform:scale(.5); }
    45%{ opacity:0; }
    55%{ opacity:1; transform:scale(1); }
    75%{ opacity:0; transform:scale(1.3); }
  }
  .blink{ animation:blink 4s ease-in-out infinite; }
  @keyframes blink{
    0%,92%,100%{ opacity:1; }
    94%{ opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .hammer, .dust, .blink{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="board-frame" aria-hidden="true"></div>
  <div class="marker-tray" aria-hidden="true">
    <span style="background:var(--marker-blue);"></span>
    <span style="background:var(--marker-red);"></span>
    <span style="background:var(--marker-orange);"></span>
    <span style="background:var(--marker-green);"></span>
  </div>

  <div class="container">
    <h1 class="title">Sabar ya, lagi dibenerin!</h1>

    <svg class="underline-scribble" viewBox="0 0 220 14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M4,7 C40,2 80,12 110,6 C140,1 180,11 216,5" stroke="var(--marker-orange)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </svg>

    <div class="scene">
      <svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" stroke="var(--ink)" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">

        <!-- speech bubble -->
        <path d="M235,30 C270,18 330,22 340,55 C348,80 322,98 292,96 C286,104 278,110 268,112 C273,102 270,96 264,94 C244,92 224,72 235,30 Z" fill="#ffffff"/>
        <text x="255" y="60" class="bubble-text">santai,</text>
        <text x="250" y="82" class="bubble-text">bentar lagi!</text>

        <!-- building under construction -->
        <g>
          <rect x="40" y="120" width="150" height="160" fill="#ffffff"/>
          <line x1="40" y1="150" x2="190" y2="150"/>
          <line x1="40" y1="180" x2="190" y2="180"/>
          <line x1="40" y1="210" x2="190" y2="210"/>
          <line x1="40" y1="240" x2="190" y2="240"/>
          <rect x="55" y="128" width="24" height="18"/>
          <rect x="95" y="128" width="24" height="18"/>
          <rect x="135" y="128" width="24" height="18"/>
          <rect x="55" y="158" width="24" height="18"/>
          <rect x="135" y="158" width="24" height="18"/>
          <rect x="95" y="188" width="24" height="18" fill="#f4e3b2"/>
          <rect x="55" y="218" width="24" height="18"/>
          <rect x="135" y="218" width="24" height="18"/>
          <rect x="100" y="245" width="30" height="35"/>
        </g>

        <!-- scaffolding -->
        <g stroke="var(--marker-orange)">
          <line x1="195" y1="280" x2="195" y2="110"/>
          <line x1="235" y1="280" x2="235" y2="110"/>
          <line x1="195" y1="150" x2="235" y2="150"/>
          <line x1="195" y1="190" x2="235" y2="190"/>
          <line x1="195" y1="230" x2="235" y2="230"/>
          <line x1="195" y1="270" x2="235" y2="270"/>
          <line x1="195" y1="270" x2="235" y2="230"/>
          <line x1="195" y1="230" x2="235" y2="190"/>
          <line x1="195" y1="190" x2="235" y2="150"/>
        </g>

        <!-- crane -->
        <g stroke="var(--marker-red)">
          <line x1="330" y1="290" x2="330" y2="60"/>
          <line x1="330" y1="60" x2="230" y2="80"/>
          <line x1="330" y1="60" x2="380" y2="70"/>
          <line x1="310" y1="290" x2="350" y2="290"/>
          <line x1="330" y1="80" x2="238" y2="88"/>
        </g>
        <line x1="238" y1="88" x2="238" y2="112" stroke="var(--ink)"/>

        <!-- ground -->
        <line x1="10" y1="290" x2="410" y2="290" stroke="var(--ink)"/>

        <!-- little person on scaffold, fixing wall -->
        <g transform="translate(213,150)">
          <!-- head -->
          <circle cx="0" cy="0" r="12" fill="#ffffff"/>
          <!-- hard hat -->
          <path d="M-12,-3 A12,10 0 0 1 12,-3 Z" fill="var(--marker-orange)" stroke="var(--marker-orange)"/>
          <line x1="-13" y1="-3" x2="13" y2="-3" stroke="var(--marker-orange)"/>
          <!-- face -->
          <circle class="blink" cx="-4" cy="1" r="1.4" fill="var(--ink)"/>
          <circle class="blink" cx="4" cy="1" r="1.4" fill="var(--ink)"/>
          <path d="M-4,6 Q0,9 4,6" />

          <!-- body -->
          <line x1="0" y1="12" x2="0" y2="42"/>
          <!-- legs -->
          <line x1="0" y1="42" x2="-10" y2="60"/>
          <line x1="0" y1="42" x2="8" y2="62"/>

          <!-- far arm holding wall -->
          <line x1="0" y1="20" x2="-16" y2="30"/>

          <!-- hammering arm group -->
          <g class="hammer">
            <line x1="0" y1="20" x2="20" y2="14"/>
            <!-- hammer head -->
            <rect x="18" y="4" width="16" height="8" rx="2" fill="var(--marker-red)" stroke="var(--marker-red)"/>
          </g>

          <!-- impact dust -->
          <g class="dust" stroke="var(--marker-orange)">
            <line x1="34" y1="8" x2="42" y2="4"/>
            <line x1="34" y1="12" x2="44" y2="12"/>
            <line x1="34" y1="16" x2="42" y2="20"/>
          </g>
        </g>
      </svg>
    </div>

    <p class="sub">Halaman ini masih dibangun sambil ngopi dulu.</p>
    <div class="scribble-note">balik lagi nanti ya! ✏️</div>
  </div>

</body>
</html>
