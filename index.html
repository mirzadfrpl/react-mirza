<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedang Dikerjakan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#cfe8e6;
    --sky-mid:#f4e6cf;
    --sky-bottom:#f7d9c4;
    --ink:#4a4038;
    --ink-soft:#7a6a5c;
    --hill-far:#a9c9b8;
    --hill-mid:#7fae94;
    --hill-near:#5c9078;
    --paper:#fffaf2;
    --accent:#e8965a;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
  }

  /* ---- sky scene ---- */
  .scene{
    position:absolute;
    inset:0;
    overflow:hidden;
  }

  .sun{
    position:absolute;
    top:8%;
    right:14%;
    width:120px;
    height:120px;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #fff6df, #ffe3ad 55%, rgba(255,227,173,0) 75%);
    filter:blur(1px);
    animation:glow 6s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ opacity:.9; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.06); }
  }

  .cloud{
    position:absolute;
    opacity:.85;
    animation:drift linear infinite;
  }
  .cloud svg{ width:100%; height:100%; display:block; }
  @keyframes drift{
    from{ transform:translateX(-10vw); }
    to{ transform:translateX(110vw); }
  }

  .hill{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    line-height:0;
  }

  .firefly{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff0c2;
    box-shadow:0 0 8px 3px rgba(255,224,150,.9);
    animation:twinkle 3.4s ease-in-out infinite, floaty 9s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; }
    50%{ opacity:1; }
  }
  @keyframes floaty{
    0%,100%{ transform:translateY(0) translateX(0); }
    50%{ transform:translateY(-18px) translateX(10px); }
  }

  /* ---- card ---- */
  .container{
    position:relative;
    z-index:5;
    text-align:center;
    padding:38px 34px 32px;
    max-width:400px;
    width:90%;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    border-radius:22px;
    border:1px solid rgba(255,255,255,.6);
    box-shadow:
      0 20px 45px -20px rgba(90,70,50,.35),
      inset 0 0 0 1px rgba(255,255,255,.4);
    backdrop-filter:blur(6px);
  }

  .pinwheel-wrap{
    display:inline-block;
    margin-bottom:14px;
    animation:sway 4s ease-in-out infinite;
    transform-origin:bottom center;
  }
  @keyframes sway{
    0%,100%{ transform:rotate(-3deg); }
    50%{ transform:rotate(3deg); }
  }
  .pinwheel{
    width:56px;
    height:56px;
    animation:spin 2.6s linear infinite;
    transform-origin:50% 42%;
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  h1{
    font-family:'Klee One', cursive;
    font-weight:600;
    font-size:1.55rem;
    margin:0 0 8px;
    color:var(--ink);
    letter-spacing:.2px;
  }

  p.sub{
    font-size:.95rem;
    color:var(--ink-soft);
    margin:0 0 20px;
    line-height:1.5;
  }

  .note{
    display:inline-block;
    font-family:'Klee One', cursive;
    font-size:.92rem;
    color:#8a5a3a;
    background:#fff3df;
    border:1px solid #f0d8ad;
    padding:10px 16px;
    border-radius:10px 14px 12px 16px;
    transform:rotate(-1.5deg);
    box-shadow:2px 3px 0 rgba(0,0,0,.04);
  }

  @media (prefers-reduced-motion: reduce){
    .cloud, .firefly, .pinwheel-wrap, .pinwheel, .sun{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="sun"></div>

    <!-- clouds -->
    <div class="cloud" style="top:12%; width:180px; height:70px; animation-duration:48s;">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="45" cy="50" rx="40" ry="26" fill="#ffffff"/>
        <ellipse cx="90" cy="35" rx="50" ry="32" fill="#ffffff"/>
        <ellipse cx="140" cy="50" rx="42" ry="24" fill="#ffffff"/>
      </svg>
    </div>
    <div class="cloud" style="top:24%; width:120px; height:50px; animation-duration:65s; animation-delay:-20s; opacity:.7;">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="45" cy="50" rx="38" ry="24" fill="#ffffff"/>
        <ellipse cx="90" cy="38" rx="46" ry="28" fill="#ffffff"/>
        <ellipse cx="135" cy="50" rx="36" ry="22" fill="#ffffff"/>
      </svg>
    </div>
    <div class="cloud" style="top:6%; width:90px; height:40px; animation-duration:38s; animation-delay:-8s; opacity:.6;">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="55" cy="50" rx="34" ry="22" fill="#ffffff"/>
        <ellipse cx="110" cy="40" rx="40" ry="26" fill="#ffffff"/>
      </svg>
    </div>

    <!-- fireflies -->
    <div class="firefly" style="left:18%; top:62%; animation-delay:.2s, .5s;"></div>
    <div class="firefly" style="left:78%; top:55%; animation-delay:1.1s, 1.8s;"></div>
    <div class="firefly" style="left:32%; top:70%; animation-delay:2s, 0s;"></div>
    <div class="firefly" style="left:64%; top:66%; animation-delay:.6s, 2.4s;"></div>
    <div class="firefly" style="left:50%; top:74%; animation-delay:1.6s, 1s;"></div>

    <!-- hills, back to front -->
    <div class="hill" style="bottom:0; opacity:.9;">
      <svg viewBox="0 0 1440 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:22vh; display:block;">
        <path d="M0,160 C240,60 400,60 640,120 C880,180 1040,40 1440,110 L1440,260 L0,260 Z" fill="var(--hill-far)"/>
      </svg>
    </div>
    <div class="hill" style="bottom:0;">
      <svg viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:16vh; display:block;">
        <path d="M0,140 C260,190 420,60 700,110 C980,160 1160,60 1440,130 L1440,220 L0,220 Z" fill="var(--hill-mid)"/>
      </svg>
    </div>
    <div class="hill" style="bottom:0;">
      <svg viewBox="0 0 1440 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:11vh; display:block;">
        <path d="M0,90 C300,140 500,40 760,80 C1040,120 1200,50 1440,90 L1440,160 L0,160 Z" fill="var(--hill-near)"/>
      </svg>
    </div>
  </div>

  <div class="container">
    <div class="pinwheel-wrap">
      <svg class="pinwheel" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g>
          <path d="M50,50 L50,10 A20,20 0 0 1 70,30 Z" fill="#e8965a"/>
          <path d="M50,50 L90,50 A20,20 0 0 1 70,70 Z" fill="#f0b27a"/>
          <path d="M50,50 L50,90 A20,20 0 0 1 30,70 Z" fill="#e8965a"/>
          <path d="M50,50 L10,50 A20,20 0 0 1 30,30 Z" fill="#f0b27a"/>
        </g>
        <circle cx="50" cy="50" r="6" fill="#4a4038"/>
      </svg>
    </div>

    <h1>Masih dalam pengerjaan</h1>
    <p class="sub">Lagi beresin beberapa bagian biar semuanya jalan mulus. Sabar ya, sebentar lagi selesai.</p>

    <div class="note">sedang dibangun, doain lancar ya~ 🌿</div>
  </div>

</body>
</html>
